name: "pint action"
description: "Validate Prometheus rules using cloudflare/pint"
branding:
  color: orange
  icon: bell
inputs:
  token:
    description: "Github token to use"
    required: true
  workdir:
    description: "Working directory to use"
    required: false
    default: "."
  config:
    description: "Config file to use"
    required: false
    default: ""
  loglevel:
    description: "Log level to use"
    required: false
    default: ""
  minSeverity:
    description: "Minimum severity to report"
    required: false
    default: ""
  requireOwner:
    description: "Require all rules to have an owner set via comment"
    required: false
    default: ""
  pr_target_repo:
    description: "Required for pull requests from forks - target PR repository"
    required: false
    default: ""
  pr_source_repo:
    description: "Required for pull requests from forks - source PR repository"
    required: false
    default: ""
  pr_number:
    description: "Pull request number. Set this to run pint ci when the event is not pull_request (workflow_run, pull_request_target). The runner overwrites GITHUB_EVENT_NAME inside container actions, so this input is what selects ci mode."
    required: false
    default: ""
  base_branch:
    description: "Base branch for pint ci. Required with pr_number when GITHUB_BASE_REF is empty."
    required: false
    default: ""
  head_ref:
    description: "Head branch for pint ci. Required with pr_number when GITHUB_HEAD_REF is empty."
    required: false
    default: ""


runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_AUTH_TOKEN: ${{ inputs.token }}
    CONFIG: ${{ inputs.config }}
    WORKDIR: ${{ inputs.workdir }}
    LOGLEVEL: ${{ inputs.loglevel }}
    MIN_SEVERITY: ${{ inputs.minSeverity }}
    REQUIRE_OWNER: ${{ inputs.requireOwner }}
    PULL_REQUEST_TARGET_REPO: ${{ inputs.pr_target_repo }}
    PULL_REQUEST_SOURCE_REPO: ${{ inputs.pr_source_repo }}
    PR_NUMBER: ${{ inputs.pr_number }}
    BASE_BRANCH: ${{ inputs.base_branch }}
    HEAD_REF: ${{ inputs.head_ref }}
